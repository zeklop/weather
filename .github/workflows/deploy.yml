name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check types and Svelte diagnostics
        run: npm run check

      - name: Run test suite
        run: npm run test

      - name: Verify app icons and safe-zone constraints
        run: npm run check:icons

      - name: Build static PWA for GitHub Pages subpath
        run: PUBLIC_BASE_PATH=/weather npm run build
        env:
          # Optional serverless backend — omit both to build in zero-backend mode
          PUBLIC_PUSH_WORKER_URL: https://weather-pwa-push.zeklop-cloudflare.workers.dev
          PUBLIC_VAPID_KEY: BF3yPCN7QaK2_vhIVyGna10aU0jfHBCFwkufLxsA5FGzzdMOImAs97Hz3QzTFzYq1Qn5kQgDRtQQsz5THfGOx9c

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke check deployed site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 6); do
            if curl -fsS -o /dev/null "$url"; then
              echo "Site is up: $url"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Deployed site did not respond at $url" >&2
          exit 1
