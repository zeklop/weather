name = "weather-pwa-push"
main = "src/index.ts"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "weather_pwa"
database_id = "30623d3d-4f6f-4036-b625-81ade0ce51bb"

[vars]
PUBLIC_VAPID_KEY = "BF3yPCN7QaK2_vhIVyGna10aU0jfHBCFwkufLxsA5FGzzdMOImAs97Hz3QzTFzYq1Qn5kQgDRtQQsz5THfGOx9c"
# Base path of the deployed frontend ("/weather" on GitHub Pages, "" for root deploys)
APP_BASE_PATH = "/weather"
# Comma-separated browser origins allowed by CORS; localhost entries serve local dev/preview
APP_ORIGIN = "https://zeklop.github.io,https://gradus.website,http://localhost:5173,http://localhost:4173"
# VAPID_PRIVATE_KEY should be set via `wrangler secret put VAPID_PRIVATE_KEY`
# ADMIN_TOKEN should be set via `wrangler secret put ADMIN_TOKEN`
